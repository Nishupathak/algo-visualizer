<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Algorithm Visualizer</title>
  </head>
  <body>
    <main>
      <h1>Algorithm Visualizer</h1>
      <nav class="nav">
        <a href="./" class="current">Sorting</a>
        <a href="./pathfinding.html">Pathfinding</a>
        <a href="./tree.html">Trees</a>
      </nav>

      <div class="toolbar">
        <select id="algo"></select>
        <select id="preset">
          <option value="random">Random</option>
          <option value="sorted">Already sorted</option>
          <option value="reversed">Reversed (worst case)</option>
          <option value="nearly">Nearly sorted</option>
          <option value="duplicates">Many duplicates</option>
        </select>
        <button id="generate">New array</button>
        <button id="back">◀ Back</button>
        <button id="play">Play</button>
        <button id="step">Step ▶</button>
        <button id="reset">Reset</button>
        <button id="compare">Compare all</button>
        <label>Speed <input id="speed" type="range" min="1" max="200" value="150" /></label>
        <label>Size <input id="size" type="range" min="5" max="100" value="20" /></label>
      </div>

      <div class="custom">
        <input id="custom" placeholder="Your own numbers: 5, 2, 9, 1, 3" />
        <button id="use-custom">Use my array</button>
        <button id="share">Copy link</button>
        <span id="error"></span>
      </div>

      <div class="layout">
        <div>
          <canvas id="canvas" width="900" height="400"></canvas>
          <input id="scrub" class="scrub" type="range" min="0" max="0" value="0" />
          <div id="explain">Press Play or Step to begin.</div>
          <div id="stats"></div>
          <div id="meta"></div>
        </div>
        <pre id="code"></pre>
      </div>

      <details id="custom-algo" open>
        <summary>Bring your own algorithm (JavaScript)</summary>
        <textarea id="code-input" spellcheck="false" rows="14"></textarea>
        <div class="custom">
          <button id="run-custom">Run my algorithm</button>
          <button id="load-starter">Load example</button>
        </div>
        <div id="custom-msg"></div>
      </details>

      <div id="compare-result"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
